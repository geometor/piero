[project]
name = "geometor-piero"
dynamic = ["version"]
authors = [
  { name = "phiarchitect", email = "github@geometor.com" },
]
description = "Folio-verified Digital Scriptorium codex of Libellus de Quinque Corporibus Regularibus by Piero della Francesca"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
piero = "geometor.piero.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["geometor*"]
namespaces = true

[tool.setuptools.dynamic]
version = { attr = "geometor.piero.__version__" }

[project.urls]
"Website" = "https://geometor.github.io/piero"
"Repository" = "https://github.com/geometor/piero"
"Issues" = "https://github.com/geometor/piero/issues"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests", "demos"]

[tool.ruff.lint]
select = ["E", "F", "I", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"
